name: Archive Actions logs

# workflow_run reads this file from the default branch. Add new workflow names
# here; the resulting artifact is attached to this collector run, not the
# original run. Each artifact contains the source run ID and attempt number.
on:
  workflow_run:
    workflows:
      - 'CodeQL'
      - 'Android'
      - 'Automerge Dependabot & WPT Updates'
      - 'Bencher'
      - 'Book Export'
      - 'DCO'
      - 'Dispatch Workflow'
      - 'Build Docker image and push to GitHub Packages'
      - 'Docs upload'
      - 'Lint ktfmt'
      - 'Lint'
      - 'Linux Arm64'
      - 'Linux Common'
      - 'Linux WPT Tests'
      - 'Linux'
      - 'MacOS Arm64'
      - 'Mac WPT Tests'
      - 'MacOS'
      - 'Main'
      - 'OpenHarmony'
      - 'WPT Export'
      - 'Release'
      - 'WPT Import'
      - 'Try (Label)'
      - 'Try'
      - 'Windows'
      - 'Worker WASM'
    types: [completed]

permissions:
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download completed run logs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actions-logs"
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_ATTEMPT/logs" > "$RUNNER_TEMP/actions-logs/logs.zip" && python3 -m zipfile -t "$RUNNER_TEMP/actions-logs/logs.zip"; then
              break
            fi
            sleep 10
          done
          python3 -m zipfile -t "$RUNNER_TEMP/actions-logs/logs.zip" || { echo 'Unable to download the completed run logs.' >&2; exit 1; }
          python3 - "$RUNNER_TEMP/actions-logs/logs.zip" "$RUNNER_TEMP/actions-logs/actions-logs-run-$SOURCE_RUN_ID-attempt-$SOURCE_ATTEMPT.txt" <<'PYTHON'
          import shutil
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive, open(sys.argv[2], 'wb') as output:
              if not any(not entry.is_dir() for entry in archive.infolist()):
                  output.write(b'GitHub returned no logs for this workflow run attempt.\n')
              for entry in archive.infolist():
                  if entry.is_dir():
                      continue
                  output.write(f"\n===== {entry.filename} =====\n".encode('utf-8'))
                  with archive.open(entry) as source:
                      shutil.copyfileobj(source, output)
                  output.write(b"\n")
          PYTHON

      - name: Upload logs for connector access
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/actions-logs/actions-logs-run-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}.txt
          archive: false
          if-no-files-found: error
          retention-days: 30
