name: Worker WASM

on:
  pull_request:
    paths:
      - '.github/workflows/worker-wasm.yml'
      - 'components/**'
      - 'ports/servo-js-wasm/**'
      - 'ports/servo-font-wasm-check/**'
      - 'ports/servo/**'
      - 'support/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'mach'
      - 'rust-toolchain.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/worker-wasm.yml'
      - 'components/**'
      - 'ports/servo-js-wasm/**'
      - 'ports/servo-font-wasm-check/**'
      - 'ports/servo/**'
      - 'support/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'mach'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-python

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Servo build dependencies
        run: |
          sudo apt update
          sudo apt install --yes clang-19
          ./mach bootstrap --yes --skip-lints --skip-nextest

      - name: Add the raw WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install pinned WASI toolchain
        run: |
          curl -fsSL --retry 3 --output "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux.tar.gz" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz
          echo '87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171  '"$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux.tar.gz" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
          "$sdk/bin/clang" --version
          /usr/bin/clang-19 --version
          test -f "$sdk/share/wasi-sysroot/lib/wasm32-wasi/libc.a"
          test -f "$sdk/share/wasi-sysroot/lib/wasm32-wasi/libc++.a"
          test -f "$sdk/share/wasi-sysroot/lib/wasm32-wasi/libc++abi.a"
          test -f "$sdk/share/wasi-sysroot/lib/wasm32-wasi/libwasi-emulated-getpid.a"
          test ! -e /usr/share/wasi-sysroot
          sudo ln -s "$sdk/share/wasi-sysroot" /usr/share/wasi-sysroot
          mkdir -p "$RUNNER_TEMP/worker-toolchain-bin"
          ln -s "$GITHUB_WORKSPACE/.github/scripts/worker-clang" "$RUNNER_TEMP/worker-toolchain-bin/clang"
          ln -s "$GITHUB_WORKSPACE/.github/scripts/worker-clang" "$RUNNER_TEMP/worker-toolchain-bin/clang++"
          chmod +x "$GITHUB_WORKSPACE/.github/scripts/worker-clang"
          printf '#include <stdio.h>\nint probe(void) { return EOF; }\n' | \
            SERVO_WASI_SDK_DIR="$sdk" "$RUNNER_TEMP/worker-toolchain-bin/clang" \
              --target=wasm32-unknown-unknown -nostdlib -x c -c -o "$RUNNER_TEMP/wasi-stdio-probe.o" -
          echo "SERVO_WASI_SDK_DIR=$sdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/worker-toolchain-bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: worker-wasm-production

      - name: Build the production Worker artifact incrementally
        env:
          WASM_CXX_LIB_DIR: ${{ runner.temp }}/wasi-sdk-29.0-x86_64-linux/share/wasi-sysroot/lib/wasm32-wasi
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked --target wasm32-unknown-unknown --no-default-features --jobs 2 \
            --profile production-stripped --manifest-path ports/servo-js-wasm/Cargo.toml \
            2>&1 | tee "$RUNNER_TEMP/worker-build.log"

      - name: Check the production artifact and run Node integration coverage
        working-directory: ports/servo-js-wasm
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/worker-tests.log"

      - name: Bundle the complete Worker without deploying
        working-directory: ports/servo-js-wasm/workerd-smoke
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4.136.3 deploy --dry-run --outdir "$RUNNER_TEMP/worker-bundle" \
            2>&1 | tee "$RUNNER_TEMP/worker-bundle.log"

      - name: Record release artifact manifest
        working-directory: ports/servo-js-wasm
        env:
          SERVO_WORKER_BUNDLE_DIR: ${{ runner.temp }}/worker-bundle
        run: |
          node release-manifest.mjs > "$RUNNER_TEMP/worker-release-manifest.json"
          node dependency-inventory.mjs > "$RUNNER_TEMP/worker-dependency-inventory.json"

      - name: Start local workerd and exercise the Worker smoke routes
        working-directory: ports/servo-js-wasm/workerd-smoke
        shell: bash
        run: |
          npx --yes wrangler@4.136.3 dev --local --ip 127.0.0.1 --port 8799 > "$RUNNER_TEMP/workerd.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8799/ > "$RUNNER_TEMP/root.json"; then
              break
            fi
            sleep 1
          done
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const root = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/root.json", "utf8"));
            assert.equal(root.passed, true, JSON.stringify(root));
            const cases = await fetch("http://127.0.0.1:8799/cases?rounds=1");
            assert.equal(cases.status, 200);
            const caseResult = await cases.json();
            assert.equal(caseResult.passed, 15, JSON.stringify(caseResult));
            assert.deepEqual(caseResult.failures, []);
            const screenshot = await fetch("http://127.0.0.1:8799/screenshot");
            assert.equal(screenshot.status, 200);
            assert.match(screenshot.headers.get("content-type"), /image\/png/);
            assert.deepEqual([...new Uint8Array(await screenshot.arrayBuffer()).slice(0, 8)],
              [137, 80, 78, 71, 13, 10, 26, 10]);
          '

      - name: Retain Worker build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-wasm-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/worker-build.log
            ${{ runner.temp }}/worker-tests.log
            ${{ runner.temp }}/worker-bundle.log
            ${{ runner.temp }}/workerd.log
            ${{ runner.temp }}/worker-release-manifest.json
            ${{ runner.temp }}/worker-dependency-inventory.json
            target/wasm32-unknown-unknown/production-stripped/servo_js_wasm.wasm
