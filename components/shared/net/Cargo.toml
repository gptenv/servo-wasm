[package]
name = "servo-net-traits"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description.workspace = true

[lib]
name = "net_traits"
path = "lib.rs"
test = false
doctest = false

[features]
test-util = []

[dependencies]
bytes = { workspace = true }
content-security-policy = { workspace = true }
cookie = { workspace = true }
crossbeam-channel = { workspace = true }
data-url = { workspace = true }
embedder_traits = { workspace = true }
headers = { workspace = true }
http = { workspace = true }
hyper_serde = { workspace = true }
ipc-channel = { workspace = true }
log = { workspace = true }
malloc_size_of = { workspace = true }
malloc_size_of_derive = { workspace = true }
mime = { workspace = true }
num-traits = { workspace = true }
paint_api = { workspace = true }
parking_lot = { workspace = true }
percent-encoding = { workspace = true }
pixels = { workspace = true }
profile_traits = { workspace = true }
rand = { workspace = true }
resvg = { workspace = true }
rustc-hash = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_with = { workspace = true }
servo-base = { workspace = true }
servo-config = { workspace = true }
servo-url = { workspace = true }
servo_arc = { workspace = true }
sys-locale = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
webrender_api = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hyper-util = { workspace = true, features = ["client-legacy", "client-proxy", "http2", "tokio"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `rand` pulls this in transitively but wasm32-unknown-unknown has no OS
# RNG for getrandom's default backends. The "custom" backend is selected
# via .cargo/config.toml's rustflags (getrandom_backend="custom"), not a
# Cargo feature -- see the wasm_getrandom module in lib.rs for why.
getrandom = { workspace = true }

[dev-dependencies]
servo-default-resources = { workspace = true }

[lints]
workspace = true
